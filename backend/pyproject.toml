[project]
name = "private-cloud-backend"
version = "0.1.0"
description = "Private Cloud File Management System Backend"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
private-cloud = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
